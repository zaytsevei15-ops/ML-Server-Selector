name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify Node version
        run: node -v

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Explicit Expo Export Bundle (Fixed arguments)
        run: npx expo export --platform android
        env:
          CI: true
          NODE_ENV: production

      - name: Copy bundle to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          if [ -f "dist/_expo/static/js/android/index-*.js" ]; then
            cp dist/_expo/static/js/android/index-*.js android/app/src/main/assets/index.android.bundle
          elif [ -f "dist/index.android.bundle" ]; then
            cp dist/index.android.bundle android/app/src/main/assets/index.android.bundle
          else
            npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          fi

      - name: Build APK with Gradle (Skipping internal bundle task)
        working-directory: ./android
        env:
          CI: true
        run: ./gradlew assembleRelease --no-daemon -x bundleReleaseJsAndAssets

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk